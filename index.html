<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOCA – AI-Driven Code Review Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --color-brand-primary: #00A9A5;
        --color-brand-secondary: #4ECCA3;
        --color-brand-accent: #8A2BE2;
        --color-bg-dark: #1A1A2E;
        --color-bg-light: #162447;
        --color-text-primary: #EAEAEA;
        --color-text-secondary: #B8B8D1;
        --color-border-color: #2C3E50;
        --color-code-bg: #0D1117;
        --color-code-border: #30363d;
      }

      [data-theme='light'] {
        --color-brand-primary: #008080; /* Deeper Teal for better contrast */
        --color-brand-secondary: #2E8B57; /* SeaGreen */
        --color-brand-accent: #6A5ACD; /* SlateBlue */
        --color-bg-dark: #F4F7FC; /* Very light, clean blue-gray background */
        --color-bg-light: #FFFFFF; /* Keep panels white for crispness */
        --color-text-primary: #1F2937; /* Cool dark gray for text */
        --color-text-secondary: #6B7280; /* Softer gray for secondary text */
        --color-border-color: #E5E7EB; /* Subtle gray border */
        --color-code-bg: #F9FAFB; /* Off-white for code blocks */
        --color-code-border: #E5E7EB; /* Match other borders */
      }

  /* particle background removed */

      @keyframes pulse-glow {
          0%, 100% {
              box-shadow: 0 0 15px var(--color-brand-primary), 0 0 5px var(--color-brand-secondary);
              transform: scale(1);
          }
          50% {
              box-shadow: 0 0 25px var(--color-brand-primary), 0 0 10px var(--color-brand-secondary);
              transform: scale(1.05);
          }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideInUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      /* Winner Animation Keyframes */
      @keyframes trophy-glow {
        0% {
          transform: scale(0.5);
          opacity: 0;
          filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #fff) drop-shadow(0 0 15px var(--color-brand-primary));
        }
        60% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
          filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 15px #fff) drop-shadow(0 0 30px var(--color-brand-primary));
        }
      }

      .confetti {
          position: absolute;
          top: -20px; /* Start off-screen */
          opacity: 0;
          animation-name: confetti-fall;
          animation-timing-function: linear;
          animation-iteration-count: 1;
          animation-fill-mode: forwards;
      }

      @keyframes confetti-fall {
          0% {
              transform: translateY(0) rotateZ(var(--initial-rotation)) rotateY(0deg);
              opacity: 1;
          }
          100% {
              transform: translateY(110vh) rotateZ(calc(var(--initial-rotation) + 720deg)) rotateY(720deg);
              opacity: 0;
          }
      }
      
       /* Loser Animation Keyframes */
      @keyframes motivation-fade-in {
        0% {
          opacity: 0;
          transform: translateY(30px);
          filter: blur(5px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      
      @keyframes text-glow-and-scale {
        0% {
            opacity: 0;
            transform: scale(0.8);
            text-shadow: 0 0 5px #fff;
        }
        60% {
            opacity: 1;
            transform: scale(1.1);
            text-shadow: 0 0 10px #fff, 0 0 20px var(--color-brand-primary), 0 0 35px var(--color-brand-primary);
        }
        100% {
            opacity: 1;
            transform: scale(1);
            text-shadow: 0 0 5px #fff, 0 0 15px var(--color-brand-primary), 0 0 25px var(--color-brand-primary);
        }
      }
      
      /* Scoreboard animations */
      @keyframes materialize {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(10px);
          clip-path: inset(45% 45% 45% 45%);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
          clip-path: inset(0% 0% 0% 0%);
        }
      }
      @keyframes dematerialize {
        from {
          opacity: 1;
          transform: scale(1);
          clip-path: inset(0% 0% 0% 0%);
        }
        to {
          opacity: 0;
          transform: scale(0.95);
          clip-path: inset(45% 45% 45% 45%);
        }
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes score-update {
        0% { transform: scale(1); color: var(--color-brand-primary); text-shadow: none; }
        50% { transform: scale(1.5); color: var(--color-brand-secondary); text-shadow: 0 0 15px var(--color-brand-secondary); }
        100% { transform: scale(1); color: var(--color-brand-primary); text-shadow: none; }
      }

      /* Glitch effect for EndGameScreen */
      .glitch-effect {
        position: relative;
        animation: text-glow-and-scale 1.5s ease-out 0.5s forwards; /* Keep the glow, but delay it */
        opacity: 0; /* Start invisible */
      }
      .glitch-effect::before,
      .glitch-effect::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--color-bg-dark);
        overflow: hidden;
      }
      .glitch-effect::before {
        left: 2px;
        text-shadow: -2px 0 var(--color-brand-accent);
        animation: glitch-anim 2s infinite linear alternate-reverse;
      }
      .glitch-effect::after {
        left: -2px;
        text-shadow: -2px 0 var(--color-brand-secondary), 2px 2px var(--color-brand-primary);
        animation: glitch-anim-2 2s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip-path: inset(89% 0 1% 0); }
        5% { clip-path: inset(43% 0 35% 0); }
        10% { clip-path: inset(89% 0 1% 0); }
        15% { clip-path: inset(23% 0 45% 0); }
        20% { clip-path: inset(89% 0 1% 0); }
        25% { clip-path: inset(13% 0 65% 0); }
        30% { clip-path: inset(89% 0 1% 0); }
        35% { clip-path: inset(53% 0 25% 0); }
        40% { clip-path: inset(89% 0 1% 0); }
        45% { clip-path: inset(3% 0 95% 0); }
        50% { clip-path: inset(89% 0 1% 0); }
        55% { clip-path: inset(63% 0 5% 0); }
        60% { clip-path: inset(89% 0 1% 0); }
        65% { clip-path: inset(23% 0 75% 0); }
        70% { clip-path: inset(89% 0 1% 0); }
        75% { clip-path: inset(43% 0 35% 0); }
        80% { clip-path: inset(89% 0 1% 0); }
        85% { clip-path: inset(13% 0 85% 0); }
        90% { clip-path: inset(89% 0 1% 0); }
        95% { clip-path: inset(53% 0 15% 0); }
        100% { clip-path: inset(89% 0 1% 0); }
      }
      @keyframes glitch-anim-2 {
        0% { clip-path: inset(3% 0 95% 0); }
        5% { clip-path: inset(53% 0 25% 0); }
        10% { clip-path: inset(3% 0 95% 0); }
        15% { clip-path: inset(83% 0 5% 0); }
        20% { clip-path: inset(3% 0 95% 0); }
        25% { clip-path: inset(43% 0 45% 0); }
        30% { clip-path: inset(3% 0 95% 0); }
        35% { clip-path: inset(13% 0 65% 0); }
        40% { clip-path: inset(3% 0 95% 0); }
        45% { clip-path: inset(73% 0 5% 0); }
        50% { clip-path: inset(3% 0 95% 0); }
        55% { clip-path: inset(23% 0 75% 0); }
        60% { clip-path: inset(3% 0 95% 0); }
        65% { clip-path: inset(93% 0 5% 0); }
        70% { clip-path: inset(3% 0 95% 0); }
        75% { clip-path: inset(33% 0 35% 0); }
        80% { clip-path: inset(3% 0 95% 0); }
        85% { clip-path: inset(63% 0 25% 0); }
        90% { clip-path: inset(3% 0 95% 0); }
        95% { clip-path: inset(93% 0 5% 0); }
        100% { clip-path: inset(3% 0 95% 0); }
      }

      .multiplayer-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (min-width: 1024px) {
        .multiplayer-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* New Multiplayer Lobby Styles */
      .lobby-card {
        position: relative;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .lobby-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 0.75rem; /* same as rounded-xl */
        border: 2px solid transparent;
        background: linear-gradient(120deg, var(--color-brand-primary), var(--color-brand-accent)) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out;
        mask-composite: exclude;
        opacity: 0.6;
        transition: opacity 0.3s ease;
      }
      .lobby-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .lobby-card:hover::before {
        opacity: 1;
      }
      
      .exit-multiplayer-btn {
        position: fixed;
        top: 6.5rem; /* Adjust based on header height */
        right: 1.5rem;
        z-index: 60;
      }

    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-primary': 'var(--color-brand-primary)',
              'brand-secondary': 'var(--color-brand-secondary)',
              'brand-accent': 'var(--color-brand-accent)',
              'bg-dark': 'var(--color-bg-dark)',
              'bg-light': 'var(--color-bg-light)',
              'text-primary': 'var(--color-text-primary)',
              'text-secondary': 'var(--color-text-secondary)',
              'border-color': 'var(--color-border-color)',
              'code-bg': 'var(--color-code-bg)',
              'code-border': 'var(--color-code-border)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out forwards',
              'slide-in-up': 'slideInUp 0.8s ease-out forwards',
              'trophy-glow': 'trophy-glow 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards',
              'motivation-fade-in': 'motivation-fade-in 1.5s ease-out forwards',
              'victory-text': 'text-glow-and-scale 1.5s ease-out forwards',
              'materialize': 'materialize 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards',
              'dematerialize': 'dematerialize 0.3s ease-in-out forwards',
              'fade-out': 'fadeOut 0.3s ease-in-out forwards',
              'score-update': 'score-update 0.8s ease-in-out',
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
  <body class="bg-bg-dark font-sans text-text-primary transition-colors duration-300">

</body>
</html>
